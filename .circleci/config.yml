version: 2.1

# Derived from the existing GitHub Actions workflows, which are treated as the
# source of truth for what CI does:
#   .github/workflows/pythonpackage.yml -> job: test (matrix over Python versions)
#   .github/workflows/codespell.yml     -> job: codespell
# See the repo's CircleCI notes for workflows that have no CircleCI equivalent
# (codeql.yml, comment.yml, newissue.yml, readmechanged.yml).

jobs:
  # Mirrors "Test Rich module" (.github/workflows/pythonpackage.yml).
  # That workflow runs format-check + typecheck + pytest once per matrix entry,
  # so this job does the same rather than splitting lint into its own job.
  test:
    parameters:
      python-version:
        type: string
    docker:
      # Version comes from pyproject.toml classifiers / the GHA matrix.
      - image: cimg/python:<< parameters.python-version >>
    environment:
      # Equivalent of snok/install-poetry's `virtualenvs-in-project: true`,
      # which is what makes the dependency cache below work.
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - checkout

      - restore_cache:
          keys:
            - rich-poetry-v1-<< parameters.python-version >>-{{ checksum "poetry.lock" }}
            - rich-poetry-v1-<< parameters.python-version >>-

      - run:
          name: Install Poetry
          # poetry.lock is "@generated by Poetry 2.1.3" (lock-version 2.1), so
          # Poetry 2.x is required to read it. Note this differs from the 1.3.1
          # pin in .github/workflows/pythonpackage.yml.
          command: |
            python -m pip install --upgrade pip
            python -m pip install "poetry==2.1.3"
            poetry --version

      - run:
          name: Install dependencies
          command: poetry install

      - save_cache:
          key: rich-poetry-v1-<< parameters.python-version >>-{{ checksum "poetry.lock" }}
          paths:
            - .venv

      - run:
          name: Format check with black
          command: poetry run make format-check

      - run:
          name: Typecheck with mypy
          command: poetry run make typecheck

      - run:
          name: Test with pytest (with coverage)
          # Same invocation as the GHA step, plus --junitxml so CircleCI can
          # ingest per-test results.
          command: |
            mkdir -p test-results
            poetry run pytest tests -v \
              --cov=./rich \
              --cov-report=xml:./coverage.xml \
              --cov-report term-missing \
              --junitxml=test-results/junit.xml

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results
          destination: test-results

      - store_artifacts:
          path: coverage.xml
          destination: coverage.xml

      # NOT TRANSLATED 1:1: the GHA job uploads coverage via
      # codecov/codecov-action@v4 using secrets.CODECOV_TOKEN. No upload step is
      # added here because that would mean inventing credentials/tooling.
      # To restore it, add the Codecov orb (pinned to an exact version) and set
      # the CODECOV_TOKEN environment variable in CircleCI project settings or a
      # context. coverage.xml is stored as an artifact above in the meantime.

  # Mirrors .github/workflows/codespell.yml.
  codespell:
    docker:
      # The GHA job runs on ubuntu-latest with its default python3; pinned here
      # to the repo's highest widely-available supported version.
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install codespell
          command: python3 -m pip install codespell
      - run:
          name: Run codespell
          command: |
            codespell \
              --ignore-words-list="ba,fo,hel,revered,womens" \
              --skip="./README.*.md,*.svg,*.ai,./benchmarks/snippets.py,./tests,./tools,*.lock"

workflows:
  ci:
    jobs:
      # Matrix mirrors the GHA matrix, minus the windows/macos legs (see notes).
      - test:
          matrix:
            parameters:
              python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
      - codespell
